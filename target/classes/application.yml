server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vapi-voicebot-poc
  cloud:
    function:
      definition: initiateProspectingCall;vapiWebhookReceiver

vapi:
  api:
    key: ${VAPI_API_KEY:sua_chave_aqui}
    base-url: https://api.vapi.ai
  phone-number-id: ${VAPI_PHONE_NUMBER_ID:seu_phone_number_id_aqui}
  elevenlabs:
    voice-id: ${VAPI_ELEVENLABS_VOICE_ID:seu_voice_id_aqui}
  anthropic:
    model: ${VAPI_ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}

app:
  webhook:
    url: ${APP_WEBHOOK_URL:http://localhost:8080/vapiWebhookReceiver}
